<style>
body {
    font-family: Arial, sans-serif;
    max-width: 500px;
    margin: auto;
    padding: 20px;
    background: #f2f2f2;
}

button {
    padding: 8px 12px;
    margin-bottom: 10px;
    cursor: pointer;
}

input {
    width: 100%;
    padding: 6px;
    margin-bottom: 10px;
    box-sizing: border-box;
}

.player-wrapper {
    position: relative;
    width: 100%;
    height: 380px;
    margin-bottom: 20px;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.player-wrapper iframe {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
}

.player-wrapper .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
    opacity: 1;
    z-index: 2;
    pointer-events: none;
    border-radius: 8px;
}

.player-wrapper .overlay::after {
    content: '';
    position: absolute;
    width: 40px;
    height: 40px;
    background: #fff;
    border-radius: 50%;
    top: 85%;
    left: 420px;
    transform: translateY(-60%);
    opacity: 0.8;
}

#result {
    font-weight: bold;
    margin-top: 10px;
}

#counter {
    margin-bottom: 10px;
    font-weight: bold;
}
</style>
</head>

<body>

<button id="startBtn" onclick="startGame()">Starta quiz</button>

<div id="counter"></div>

<div class="player-wrapper">
    <iframe
        id="spotifyPlayer"
        width="100%"
        height="380"
        frameborder="0"
        allow="encrypted-media">
    </iframe>
    <div class="overlay"></div>
</div>

<input id="decadeInput" placeholder="År (t.ex. 1957 eller 1990)">
<input id="genreInput" placeholder="Genre (t.ex. pop)">
<input id="artistInput" placeholder="Artist">

<button onclick="checkAnswer()">Kolla svar</button>
<button onclick="nextAfterAnswer()">Nästa låt</button>

<button id="againBtn" onclick="startGame()" style="display:none;">
Kör igen
</button>

let shuffledTracks = [];
let currentIndex = 0;
let currentTrack = null;
let totalPoints = 0;
let maxPoints = 0;
let answered = false;

function startGame() {
    shuffledTracks = shuffle([...TRACKS]);
    currentIndex = 0;
    totalPoints = 0;
    maxPoints = shuffledTracks.length * 3;
    answered = false;

    document.getElementById("startBtn").style.display = "none";
    document.getElementById("againBtn").style.display = "none";

    nextSong();
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function nextSong() {

    if (currentIndex >= shuffledTracks.length) {
        endGame();
        return;
    }

    currentTrack = shuffledTracks[currentIndex];
    currentIndex++;
    answered = false;

    document.getElementById("counter").textContent =
        "Låt " + currentIndex + " / " + shuffledTracks.length;

    const iframe = document.getElementById("spotifyPlayer");
    iframe.src =
        "https://open.spotify.com/embed/track/" +
        currentTrack.uri +
        "?rand=" + Math.random();

    document.getElementById("result").textContent = "";
    document.getElementById("decadeInput").value = "";
    document.getElementById("genreInput").value = "";
    document.getElementById("artistInput").value = "";
}

function normalize(text) {
    return (text ?? "").toString().trim().toLowerCase();
}

function yearToDecadeNumber(year) {
    // 1957 -> 50
    return Math.floor((year % 100) / 10) * 10;
}

function parseUserDecade(input) {

    input = input.trim();

    if (!input) return null;

    // 1957
    if (/^\d{4}$/.test(input)) {
        return Math.floor((parseInt(input) % 100) / 10) * 10;
    }

    // 1950
    if (/^\d{4}$/.test(input)) {
        return Math.floor((parseInt(input) % 100) / 10) * 10;
    }

    // 50
    if (/^\d{2}$/.test(input)) {
        return Math.floor(parseInt(input) / 10) * 10;
    }

    return null;
}


function checkAnswer() {

    if (!currentTrack || answered) return;

    const userDecade =
        parseUserDecade(
            document.getElementById("decadeInput").value
        );

    const userGenre =
        normalize(document.getElementById("genreInput").value);

    const userArtist =
        normalize(document.getElementById("artistInput").value);

    const correctDecade =
    yearToDecadeNumber(currentTrack.year);

    const correctArtist =
        normalize(currentTrack.artist);

    const correctGenres =
        currentTrack.genres
            .split(",")
            .map(g => normalize(g));

    let points = 0;

    if (userDecade && userDecade === correctDecade) points++;
    if (userGenre && correctGenres.includes(userGenre)) points++;
    if (userArtist && userArtist === correctArtist) points++;

    totalPoints += points;
    answered = true;

    document.getElementById("result").textContent =
        `Du fick ${points}/3 på denna låt.
Totalt: ${totalPoints}/${maxPoints}
Rätt svar:
${currentTrack.artist} – ${currentTrack.title}
Genre: ${currentTrack.genres}
Årtionde: ${yearToDecadeNumber(currentTrack.year)}`;
}

function nextAfterAnswer() {
     if (!answered) {
        alert("Kolla svaret först!");
        return;
    }

    nextSong();
}

function endGame() {

    document.getElementById("spotifyPlayer").src = "";
    document.getElementById("counter").textContent = "";

    document.getElementById("result").textContent =
        `🎉 Spelet klart!
Totalt resultat: ${totalPoints} / ${maxPoints}`;

    document.getElementById("againBtn").style.display = "inline-block";
}
</script>
